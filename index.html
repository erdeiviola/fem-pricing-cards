<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Pricing Component</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
 <body >
   <main class="main-container">
    
    <h1>Our Pricing</h1>
    
      
       <div class="toggle-container">
         <span>Annually</span>
         <button class="switch-btn " type="button" role="switch" aria-label="Billing period" aria-checked="false">
           <span class="switch-btn-circle"></span>
         </button>
         <span>Monthly</span>
       
       </div>
   
    <div class="card-container">
      <div class="pricing-card">
        <h2>Basic</h2>
        <h3 class="monthly-price" style="display: block;"><span>&dollar;</span>19.99</h3>
       
        <h3 class="yearly-price" style="display: none;"><span>&dollar;</span>199.99</h3>
        
        <p>500 GB Storage</p>
    
        <p>2 Users Allowed</p>
        
        <p>Send up to 3 GB</p>
        <button type="button" class="pricing-card-btn">Learn More</button>
      </div>
      <div class="pricing-card active">
        <h2>Professional</h2>
        <h3 class="monthly-price" style="display: block;"><span>&dollar;</span>24.99</h3>
       
        <h3 class="yearly-price" style="display: none;"><span>&dollar;</span>249.99</h3>
        
        <p>1 TB Storage</p>
    
        <p>5 Users Allowed</p>
        
        <p>Send up to 10 GB</p>
        <button type="button" class="pricing-card-btn">Learn More</button>
      </div>
      <div class="pricing-card">
        <h2>Master</h2>
        <h3 class="monthly-price" style="display: block;"><span>&dollar;</span>39.99</h3>
       
        <h3 class="yearly-price" style="display: none;"><span>&dollar;</span>399.99</h3>
        
        <p>2 TB Storage</p>
    
        <p>10 Users Allowed</p>
        
        <p>Send up to 20 GB</p>
        <button type="button" class="pricing-card-btn">Learn More</button>
      </div>
      </div>
   </main>
   <script src="./script.js"></script>
</body>
</html>
